name: Demo salon
# One-off: builds the fictional demo salon «سالن زیبایی آینه» (/s/ayneh) on the live site.
# images: makes the logo, cover and manager portrait into demo/ayneh/ and commits them to this branch.
# create: signs in as the owner and creates or updates the salon with those images and a full profile.
# Runs on every push to the demo-salon branch; demo/ayneh/run.env sets MODE, ONLY and FORCE.
on:
  push:
    branches: [demo-salon]
  workflow_dispatch:
    inputs:
      mode:
        description: 'images or create'
        type: choice
        options: [images, create]
        default: images
      only:
        description: 'images only: logo, cover, portrait (empty = all missing)'
        type: string
        default: ''
      force:
        description: 'images only: make them again'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: demo-salon
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Settings
        id: cfg
        run: |
          MODE='${{ inputs.mode }}'; ONLY='${{ inputs.only }}'; FORCE='${{ inputs.force && '1' || '0' }}'
          if [ -f demo/ayneh/run.env ] && [ -z "$MODE" ]; then . demo/ayneh/run.env; fi
          echo "mode=${MODE:-images}" >> "$GITHUB_OUTPUT"; echo "only=$ONLY" >> "$GITHUB_OUTPUT"; echo "force=${FORCE:-0}" >> "$GITHUB_OUTPUT"
      - run: npm install --no-save sharp@0.34
        if: steps.cfg.outputs.mode == 'images'
      - name: Run
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
          ONLY: ${{ steps.cfg.outputs.only }}
          FORCE: ${{ steps.cfg.outputs.force }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: node scripts/demo-salon.mjs
      - name: Commit images
        if: always() && steps.cfg.outputs.mode == 'images'
        run: |
          git add demo
          if git diff --cached --quiet; then echo "No new images."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Demo salon images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
