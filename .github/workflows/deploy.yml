name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Check Cloudflare configuration
        id: config
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing; skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply D1 migrations
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote
      - name: Deploy worker
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Push runtime secrets to the worker
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          OWNER_PASSWORD_HASH: ${{ secrets.OWNER_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          KAVENEGAR_SENDER: ${{ secrets.KAVENEGAR_SENDER }}
          SMS_LIVE_ENABLED: ${{ secrets.SMS_LIVE_ENABLED }}
          SCHEDULER_ENABLED: ${{ secrets.SCHEDULER_ENABLED }}
        run: |
          set -euo pipefail
          npm install --no-save wrangler@4 >/dev/null 2>&1
          for name in KIE_API_KEY OWNER_EMAIL OWNER_ID OWNER_PASSWORD OWNER_PASSWORD_HASH \
                      SESSION_SECRET JOB_TOKEN APP_ORIGIN KAVENEGAR_API_KEY KAVENEGAR_SENDER \
                      SMS_LIVE_ENABLED SCHEDULER_ENABLED; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "secret set: $name"
            fi
          done
      - name: Summary
        if: steps.config.outputs.ready == 'true'
        run: echo "Deployed https://ayneh-hair-studio.<your-subdomain>.workers.dev" >> "$GITHUB_STEP_SUMMARY"
