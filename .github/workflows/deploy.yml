name: Deploy to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore:
      - 'mezon/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Check Cloudflare configuration
        id: config
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing; skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply D1 migrations
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote
      # The owner's Android payment app «آینه‌پی» (android/) ships with the site as a static file
      # (public/app/ayneh-pay.apk; download page /app). Its signing key is made once and kept in
      # D1 (table ci_store, never in git), so every build installs as an update. A failed app
      # build never stops the site deploy.
      - uses: actions/setup-java@v4
        if: steps.config.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.config.outputs.ready == 'true'
        with:
          gradle-version: '8.9'
      - name: Build the Android payment app
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          npm install --no-save --prefix /tmp/w wrangler@4 >/dev/null 2>&1
          W=/tmp/w/node_modules/.bin/wrangler
          q() { $W d1 execute DB --remote --json --command "$1" 2>/dev/null; }
          q "CREATE TABLE IF NOT EXISTS ci_store (key TEXT PRIMARY KEY, value TEXT NOT NULL)" >/dev/null
          q "SELECT key,value FROM ci_store WHERE key IN ('android_ks','android_ks_pass')" > /tmp/ks.json || echo '[]' > /tmp/ks.json
          node -e 'const r=(JSON.parse(require("fs").readFileSync("/tmp/ks.json","utf8"))[0]||{}).results||[];const m=Object.fromEntries(r.map(x=>[x.key,x.value]));if(m.android_ks&&m.android_ks_pass){require("fs").writeFileSync("android/app/release.jks",Buffer.from(m.android_ks,"base64"));require("fs").writeFileSync("/tmp/ks.pass",m.android_ks_pass)}'
          if [ ! -s android/app/release.jks ] || [ ! -s /tmp/ks.pass ]; then
            echo "no stored signing key: making one and storing it in D1"
            rm -f android/app/release.jks
            head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24 > /tmp/ks.pass
            keytool -genkeypair -keystore android/app/release.jks -storetype PKCS12 -alias aynehpay -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$(cat /tmp/ks.pass)" -keypass "$(cat /tmp/ks.pass)" -dname "CN=Ayneh Pay, O=Ayneh, C=IR" >/dev/null 2>&1
            q "INSERT OR REPLACE INTO ci_store(key,value) VALUES('android_ks','$(base64 -w0 android/app/release.jks)'),('android_ks_pass','$(cat /tmp/ks.pass)')" >/dev/null
          fi
          echo "::add-mask::$(cat /tmp/ks.pass)"
          KS_PASS="$(cat /tmp/ks.pass)" gradle -p android assembleRelease --no-daemon -q
          mkdir -p public/app
          cp android/app/build/outputs/apk/release/app-release.apk public/app/ayneh-pay.apk
          printf '1.0.%s' "$VERSION_CODE" > public/app/version.txt
          rm -f android/app/release.jks /tmp/ks.pass /tmp/ks.json
          ls -la public/app
      - name: Deploy worker
        id: deploy
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Push runtime secrets to the worker
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          OWNER_PASSWORD_HASH: ${{ secrets.OWNER_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          # The public address: the custom domain, unless a repository variable APP_ORIGIN says otherwise.
          APP_ORIGIN: ${{ vars.APP_ORIGIN || 'https://ayneh-salon.site' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_BOT_USERNAME: ${{ secrets.BALE_BOT_USERNAME }}
          MELIPAYAMAK_TOKEN: ${{ secrets.MELIPAYAMAK_TOKEN }}
          MELIPAYAMAK_BODY_ID: ${{ secrets.MELIPAYAMAK_BODY_ID }}
          MELIPAYAMAK_OTP_BODY_ID: ${{ secrets.MELIPAYAMAK_OTP_BODY_ID }}
        run: |
          set -euo pipefail
          npm install --no-save wrangler@4 >/dev/null 2>&1
          for name in KIE_API_KEY OWNER_EMAIL OWNER_ID OWNER_PASSWORD OWNER_PASSWORD_HASH \
                      SESSION_SECRET JOB_TOKEN APP_ORIGIN TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET \
                      TELEGRAM_BOT_USERNAME MELIPAYAMAK_TOKEN MELIPAYAMAK_BODY_ID MELIPAYAMAK_OTP_BODY_ID BALE_BOT_TOKEN BALE_BOT_USERNAME; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              # Cloudflare's own git build can upload a newer version at the same moment, and then
              # secrets cannot be edited ("latest version isn't deployed"): redeploy this code and retry.
              ok=""
              for try in 1 2 3 4; do
                if printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null 2>secret.err; then ok=1; break; fi
                grep -q "isn't currently deployed" secret.err || { cat secret.err; exit 1; }
                echo "secret $name: a newer version is not deployed yet; redeploying and retrying ($try)"
                sleep 15; npx wrangler deploy >/dev/null 2>&1 || true
              done
              [ -n "$ok" ] || { cat secret.err; exit 1; }
              echo "secret set: $name"
            fi
          done
      - name: Point the Telegram bot at this deployment
        if: steps.config.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ORIGIN: ${{ vars.APP_ORIGIN || 'https://ayneh-salon.site' }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$SECRET" ] || [ -z "$ORIGIN" ]; then echo "Telegram or APP_ORIGIN not configured; skipping webhook."; exit 0; fi
          curl -sS -o /dev/null -w "setWebhook HTTP %{http_code}\n" "https://api.telegram.org/bot$TOKEN/setWebhook" \
            --data-urlencode "url=$ORIGIN/api/telegram/webhook" --data-urlencode "secret_token=$SECRET" \
            --data-urlencode 'allowed_updates=["message","callback_query"]'
      - name: Point the Bale bot at this deployment
        if: steps.config.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ORIGIN: ${{ vars.APP_ORIGIN || 'https://ayneh-salon.site' }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$SECRET" ] || [ -z "$ORIGIN" ]; then echo "Bale or APP_ORIGIN not configured; skipping."; exit 0; fi
          curl -sS -o /dev/null -w "Bale setWebhook HTTP %{http_code}\n" "https://tapi.bale.ai/bot$TOKEN/setWebhook" --data-urlencode "url=$ORIGIN/api/bale/webhook/$SECRET"
      - name: Summary
        if: steps.config.outputs.ready == 'true'
        env:
          URL: ${{ vars.APP_ORIGIN || 'https://ayneh-salon.site' }}
        run: echo "Deployed ${URL:-(address not reported)}" >> "$GITHUB_STEP_SUMMARY"
