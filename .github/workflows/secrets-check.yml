name: Secrets check
on:
  push:
    branches: [arena/7ff7d538-ayneh-hair-studio]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: CLOUDFLARE_API_TOKEN
        continue-on-error: true
        run: test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}"
      - name: CLOUDFLARE_ACCOUNT_ID
        continue-on-error: true
        run: test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      - name: SESSION_SECRET
        continue-on-error: true
        run: test -n "${{ secrets.SESSION_SECRET }}"
      - name: OWNER_PASSWORD
        continue-on-error: true
        run: test -n "${{ secrets.OWNER_PASSWORD }}"
      - name: OWNER_EMAIL
        continue-on-error: true
        run: test -n "${{ secrets.OWNER_EMAIL }}"
      - name: KIE_API_KEY
        continue-on-error: true
        run: test -n "${{ secrets.KIE_API_KEY }}"
