name: Deploy four independent specialist editions
on:
  push:
    branches: [specialist-editions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ayneh-specialists
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: bash scripts/build.sh && node scripts/validate-artifact.mjs
      - run: npm install --no-save wrangler@4
      - name: Deploy the four new Workers only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          OWNER_PASSWORD_HASH: ${{ secrets.OWNER_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "${OWNER_PASSWORD:-}${OWNER_PASSWORD_HASH:-}"
          for line in hair color nails lashes; do
            cfg="editions/$line/wrangler.toml"
            npx wrangler d1 migrations apply DB --remote --config "$cfg"
            npx wrangler deploy --config "$cfg"
            names=$(npx wrangler secret list --config "$cfg" | jq -r '.[].name')
            for key in SESSION_SECRET CONFIG_ENCRYPTION_KEY JOB_TOKEN TELEGRAM_WEBHOOK_SECRET; do
              if ! echo "$names" | grep -qx "$key"; then
                value=$(openssl rand -hex 32)
                printf '%s' "$value" | npx wrangler secret put "$key" --config "$cfg" >/dev/null
              fi
            done
            for key in KIE_API_KEY OWNER_PASSWORD OWNER_PASSWORD_HASH; do
              value="${!key:-}"
              if [ -n "$value" ]; then
                printf '%s' "$value" | npx wrangler secret put "$key" --config "$cfg" >/dev/null
              fi
            done
            # Never reuse a Telegram/Bale token, SMS template, DB or KV from the original app.
            echo "Published independent edition: $line"
          done
