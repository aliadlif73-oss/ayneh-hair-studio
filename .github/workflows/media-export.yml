name: Remove the temporary media export
on:
  push:
    branches: [media-export]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the encrypted release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --repo ${{ github.repository }} --limit 50 --json tagName --jq '.[].tagName|select(startswith("media-export-"))'); do
            gh release delete "$t" --repo ${{ github.repository }} --cleanup-tag --yes && echo "deleted $t"
          done
