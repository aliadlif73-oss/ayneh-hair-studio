name: Export media (one-off, encrypted)
on:
  push:
    branches: [media-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download every stored image and encrypt it for the owner
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB: d1f05be3-2420-4f72-b541-60ac5f5853c4
          NS: ded9d8ee91da4d3ebb2a5f220ef90df2
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4/accounts/$A
          curl -fsS -X POST "$API/d1/database/$DB/query" -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT m.id,m.object_key k,m.kind,m.mime,m.created_at t,COALESCE(m.session_id,m.id) sid,COALESCE(s.slug,m.salon_id) slug FROM media m LEFT JOIN salons s ON s.id=m.salon_id ORDER BY m.created_at"}' > list.json
          node -e '
            const r=require("./list.json").result[0].results,ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"};
            const lines=r.map(x=>{const d=new Date(x.t+12600000).toISOString().slice(0,16).replace("T","_").replace(":","");
              return [x.k, x.slug+"/"+x.kind+"/"+d+"_"+x.sid.slice(0,8)+"_"+x.id.slice(0,8)+"."+(ext[x.mime]||"bin")].join("\t")});
            require("fs").writeFileSync("plan.tsv",lines.join("\n")+"\n");console.log(r.length+" images")'
          mkdir out; ok=0; miss=0
          while IFS=$'\t' read -r key name; do
            mkdir -p "out/$(dirname "$name")"
            if curl -fsS "$API/storage/kv/namespaces/$NS/values/$(node -p 'encodeURIComponent(process.argv[1])' "$key")" -H "Authorization: Bearer $T" -o "out/$name"; then ok=$((ok+1)); else miss=$((miss+1)); rm -f "out/$name"; fi
          done < plan.tsv
          echo "downloaded=$ok missing=$miss"; du -sh out
          tar -C out -cf media.tar . && rm -rf out list.json
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in media.tar -out media.tar.enc -pass file:k.txt && rm media.tar
          cat > pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA6mEJEOz2uHKGoq7bwhlb
          rm5UDgR9UVsv00Avo03CeKI//IkF7cjWQwUExZeEQGtVvu3l1x4/q7Bl5Z9PARXN
          pcLWeK1Tesy8PrCWxIT73yUZ6D7JgIZ+kPfZ2kwwniUtP7I4kA/9gveMEE2lFAdS
          hDJIkV6cmjio4GD86S5I2wLZxfZdGorS2ny5FnMWh5NPg8BdevPqSpF5RsL9LAH5
          NtzSErCubO3R/RxSViXJ3TNwfRjIaAzqVTz3aQ+vszVzNMMRXnHSWgl7vTw0H2si
          nUgGJCMOjogCbVyKEdHqhKZSyz47h7nKq0IgSvbjUzeLfi2g/FdWBQ2WmCUt1OdH
          WyVBsaDjO4zYfB9TrTVorNPXftBV0Tv1YqQ9E5QkdYxr9JkvTLBdfL9Hb8SKC8Yd
          ISL23nYiEXWzeZgqJl+NXNP+1TWgJNJHuEkXnp8UfZytu7ZKDoSyopAjf803lAlc
          POq6OOggfLULZSLq4p6E75IUEA9w8zQE7CO4BSLWQatGhICbxKxs812d64+aZtYu
          jkTsjefTEi/b9vJKycKd/kSIwe/w0RGY20i3Q7FQOax6EwrRR8nbASZnnXv5x+Qy
          WthOvHYaYV7lhwlp67A4KA7xJWnS/d6Q2JpXBNU9V5hqCCPZXcVs7ZY330e7tw+x
          n+0Pq+0F2Wvgs3ifo7qjD/ECAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.txt -out key.enc && rm k.txt
          ls -la media.tar.enc key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: media-export
          path: |
            media.tar.enc
            key.enc
          retention-days: 1
