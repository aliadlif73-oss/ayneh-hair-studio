  <!-- ============ Service page hero (filled per service by build.py) ============ -->
  <section id="intro" class="hero hero--service" aria-labelledby="h1">
    <span class="ornament ornament--tr" aria-hidden="true"></span>
    <div class="band">
      <div class="hero-grid">
        <div class="hero-copy">
          <a class="hero-back" href="/"><span aria-hidden="true">→</span> آینه · همهٔ خدمات</a>
          <span class="eyebrow">{{EYEBROW}}</span>
          <h1 id="h1" class="h1">{{H1}}<span class="h1__accent">{{ACCENT}}</span></h1>
          <p class="hero-lead">{{LEAD}}</p>
          <div class="hero-actions">
            <a class="btn btn--lg" href="#services"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8.5h16l-1.2 11a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8Z" stroke-linejoin="round"/><path d="M9 8.5V6.8a3 3 0 0 1 6 0v1.7" stroke-linecap="round"/></svg>دیدن پلن‌ها و خرید</a>
            <a class="btn btn--ghost btn--lg" href="#try-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4.5 17 5-5 3.5 3.5L16 12l3.5 3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>امتحان روی عکس خودتان</a>
          </div>
          <ul class="hero-points">
{{POINTS}}
          </ul>
        </div>

        <div class="hero-visual">
          <div class="hero-stage">
            <div class="compare-wrap{{WRAP_CLASS}}">
              <div class="compare" id="heroCompare" aria-label="مقایسهٔ قبل و شبیه‌سازی {{FIRST_LABEL}}">
                <img class="compare__img compare__img--before" id="compareBefore" src="assets/demo-{{FIRST}}-before.webp" width="450" height="600" fetchpriority="high" decoding="async" alt="نمونهٔ موقت از عکس مشتری">
                <img class="compare__img compare__img--after" id="compareAfter" src="assets/demo-{{FIRST}}-after.webp" width="450" height="600" decoding="async" alt="نمونهٔ موقت از شبیه‌سازی {{FIRST_LABEL}}">
                <span class="compare__badge"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="m12 3 2.4 5.4L20 10.5l-5.6 2.1L12 18l-2.4-5.4L4 10.5l5.6-2.1Z"/></svg>نتیجه با هوش مصنوعی</span>
                <span class="compare__tag compare__tag--before">قبل از تغییر</span>
                <span class="compare__tag compare__tag--after">بعد از تغییر</span>
                <span class="compare__divider" aria-hidden="true"></span>
                <span class="compare__knob" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 8 5 12l4 4m6-8 4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <input class="compare__range" id="compareRange" type="range" min="0" max="100" value="50" dir="rtl" aria-label="جابجا کردن خط مقایسهٔ قبل و شبیه‌سازی">
              </div>
{{THUMBS}}
            </div>
            <p class="stage-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11v5" stroke-linecap="round"/></svg><span>نمونهٔ موقت؛ شبیه‌سازی تقریبی است و نتیجهٔ نهایی را تضمین نمی‌کند.</span></p>
          </div>
        </div>
      </div>
    </div>
  </section>
