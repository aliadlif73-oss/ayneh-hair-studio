  <!-- ============ Service page · one REAL before/after (omitted until a real one exists) ============ -->
  <!-- build.py REAL_SAMPLES fills this. Until real Ayneh results exist the owner chose illustrative
       pairs; they are labelled «نمونهٔ نمایشی», never «ساخته‌شده با آینه». -->
  <section id="sample" class="section real-sample" aria-labelledby="h-sample">
    <div class="band">
      <div class="head">
        <h2 id="h-sample" class="h2">{{SAMPLE_TITLE}}</h2>
        <p class="sub">نمونهٔ نمایشی از تغییر.</p>
      </div>
      <div class="real-sample__box">
        <div class="compare" aria-label="نمونهٔ نمایشی: قبل و بعد">
          <img class="compare__img compare__img--before" src="{{REAL_BEFORE}}" width="450" height="600" loading="lazy" decoding="async" alt="">
          <img class="compare__img compare__img--after" src="{{REAL_AFTER}}" width="450" height="600" loading="lazy" decoding="async" alt="">
          <span class="compare__tag compare__tag--before">قبل</span>
          <span class="compare__tag compare__tag--after">بعد</span>
          <span class="compare__divider" aria-hidden="true"></span>
          <span class="compare__knob compare__knob--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 8 5 12l4 4m6-8 4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <input class="compare__range" type="range" min="0" max="100" value="50" dir="rtl" aria-label="جابه‌جا کردن خط مقایسه">
        </div>
        <p class="samples__note">نمونهٔ نمایشی</p>
      </div>
    </div>
  </section>

  <!-- ============ Service page · three benefits of this service ============ -->
  <section id="benefits" class="section section--soft benefits" aria-labelledby="h-benefits">
    <div class="band">
      <div class="benefits__grid">
        <div class="benefits__copy">
          <h2 id="h-benefits" class="h2">{{BEN_TITLE}}</h2>
          <p class="sub">{{BEN_SUB}}</p>
          <ul class="benefits__list">
{{BENEFITS}}
          </ul>
        </div>
        <figure class="benefits__fig">
          <img src="assets/demo-{{PAIR}}-after.webp" width="450" height="600" loading="lazy" decoding="async" alt="نمونهٔ نمایشی: {{LABEL}} روی عکس مشتری">
          <figcaption>نمونهٔ نمایشی</figcaption>
        </figure>
      </div>
    </div>
  </section>
