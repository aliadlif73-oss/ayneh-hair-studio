<form class="lead" id="leadForm" novalidate aria-labelledby="h-lead">
  <h3 id="h-lead" class="sr-only">درخواست دمو</h3>
  <p class="lead__intro">بدون پرداخت و بدون انتشار صفحه، برای هماهنگی دمو و راه‌اندازی با شما تماس می‌گیریم.</p>
  <div class="lead__grid">
    <div class="lead__field"><label for="lf-salon">نام شما یا آرایشگاه</label><input id="lf-salon" name="salon" type="text" autocomplete="organization" maxlength="80" required></div>
    <div class="lead__field"><label for="lf-phone">شمارهٔ موبایل</label><input id="lf-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="۰۹۱۲۰۰۰۰۰۰۰" maxlength="20" required><small class="lead__privacy">شماره فقط برای پیگیری همین درخواست استفاده می‌شود.</small></div>
    <div class="lead__field"><label for="lf-name">نام شما</label><input id="lf-name" name="name" type="text" autocomplete="name" maxlength="60" required></div>
    <div class="lead__field"><label for="lf-city">شهر <span class="opt">(اختیاری)</span></label><input id="lf-city" name="city" type="text" autocomplete="address-level2" maxlength="40"></div>
  </div>
  <div class="lead__hp" aria-hidden="true"><label for="lf-web">وب‌سایت</label><input id="lf-web" name="website" type="text" tabindex="-1" autocomplete="off"></div>
  <label class="lead__check" for="lf-consent"><input id="lf-consent" name="consent" type="checkbox"><span>موافقم برای هماهنگی دمو و راه‌اندازی صفحهٔ سالن با من تماس بگیرید.</span></label>
  <p class="lead__err" id="lf-err" role="alert"></p>
  <button class="btn btn--lg" type="submit" id="lf-send"><span>درخواست دمو را بفرستید</span></button>
  <div class="lead__done" id="lf-done" role="status" hidden></div>
</form>
