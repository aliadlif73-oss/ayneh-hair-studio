  <!-- ============ Hero (home, the four service pages, the salon-panel page) ============ -->
  <!-- One template; build.py fills the {{…}} slots. The visual is an 8-second loop of three
       frames with no scroll and no sound (src/copy.css). -->
  <section id="intro" class="hero{{HERO_CLASS}}" aria-labelledby="h1">
    <span class="ornament ornament--tr" aria-hidden="true"></span>
    <div class="band">
      <div class="hero-grid">
        <div class="hero-copy">
{{EYEBROW}}          <h1 id="h1" class="h1">{{H1}}<span class="h1__accent">{{ACCENT}}</span></h1>
          <p class="hero-lead">{{LEAD}}</p>
          <div class="hero-actions">
            <a class="btn btn--lg" href="#demo">{{MAIN_BTN}}</a>
            <a class="hero-link" href="#services">قیمت پلن‌ها <span aria-hidden="true">←</span></a>
          </div>
        </div>

        <div class="hero-visual">
          <div class="hero-stage loop" role="group" aria-label="نمونهٔ نمایشی: سه قاب پشت‌سرهم">
            <div class="loop__screen">
              <figure class="loop__f loop__f--1">
                <img src="assets/demo-{{PAIR}}-before.webp" width="450" height="600" loading="eager" fetchpriority="high" decoding="async" alt="نمونهٔ نمایشی از عکس مشتری">
                <figcaption><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 8.5h3l1.4-2h7.2l1.4 2h3V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18Z" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2"/></svg>مشتری عکس می‌گذارد</figcaption>
              </figure>
              <figure class="loop__f loop__f--2">
                <img src="assets/demo-{{PAIR}}-after.webp" width="450" height="600" loading="eager" decoding="async" alt="نمونهٔ نمایشی از شبیه‌سازی روی عکس مشتری">
                <figcaption><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.4 5.4L20 10.5l-5.6 2.1L12 18l-2.4-5.4L4 10.5l5.6-2.1Z"/></svg>{{F2}}</figcaption>{{PICKS}}
              </figure>
              <figure class="loop__f loop__f--3">
{{CHAT}}
                <figcaption><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M20.5 4 3.5 10.8l5.6 2.1L11 19l3-4.2 4.6 3.3Z" stroke-linejoin="round"/></svg>درخواست به شما می‌رسد</figcaption>
              </figure>
            </div>
            <button class="loop__toggle" type="button" aria-pressed="false">توقف نمایش</button>
            <ol class="loop__dots" aria-hidden="true"><li></li><li></li><li></li></ol>
            <p class="stage-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11v5" stroke-linecap="round"/></svg><span>{{NOTE}}</span></p>
          </div>
        </div>
      </div>
    </div>
  </section>
