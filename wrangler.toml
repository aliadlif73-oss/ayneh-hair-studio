# Cloudflare Workers deployment — no ChatGPT account or Sites panel needed.
# One-time setup: create the D1 database and R2 bucket (see DEPLOY-CLOUDFLARE.md),
# then paste the real D1 id below. Every secret is pushed as a Worker secret by
# .github/workflows/deploy.yml from GitHub repository secrets, so nothing secret
# ever lives in this file.
name = "ayneh-hair-studio"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "ayneh"
database_id = "PASTE_D1_DATABASE_ID"
migrations_dir = "drizzle"

# Photo storage. Workers KV is on the free plan and needs no payment method.
[[kv_namespaces]]
binding = "KV"
id = "PASTE_KV_NAMESPACE_ID"

# Optional: R2 needs a payment method on the account. If you enable R2 billing later,
# uncomment this block, delete the KV block and keep bucket name "ayneh-media".
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "ayneh-media"

# Reminders, followups and retention cleanup run automatically; no GitHub cron needed.
[triggers]
crons = ["*/10 * * * *"]
